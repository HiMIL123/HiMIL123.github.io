<textarea id="code" rows="6" cols="60" placeholder="Paste character code"></textarea><br>
<button id="go">Convert</button>
<pre id="out"></pre>

<script>
function decodeCharacterCode(code) {
  // Clean whitespace and convert URL-safe base64 to standard base64
  let b64 = code.trim().replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";

  // atob gives a binary string; decode it as UTF-8 so non-ASCII text survives
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const text = new TextDecoder("utf-8").decode(bytes);

  return JSON.parse(text);
}

document.getElementById("go").onclick = () => {
  const out = document.getElementById("out");
  try {
    const obj = decodeCharacterCode(document.getElementById("code").value);
    out.textContent = JSON.stringify(obj, null, 2); // pretty-printed JSON
  } catch (e) {
    out.textContent = "Could not decode: " + e.message;
  }
};
</script>
